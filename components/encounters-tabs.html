<!-- ENCOUNTERS -->
<section class="section" id="encounters">
  <div class="container">
    <div class="section-header">
      <div>
        <div class="section-label">Encounters</div>
      </div>
    </div>

    <!-- Encounter Tabs -->
    <div class="encounter-tabs" role="tablist" aria-label="Encounters">
      <button class="encounter-tab active" role="tab" aria-selected="true" data-enc="0" onclick="switchEncounterTab(0)">
        <span class="tab-number">E1</span>
        <span class="tab-name">Kalli</span>
        <span class="tab-type">Plate Puzzle</span>
        <span class="tab-completed-badge" id="tab-badge-0">✓</span>
      </button>
      <button class="encounter-tab" role="tab" aria-selected="false" data-enc="1" onclick="switchEncounterTab(1)">
        <span class="tab-number">E2</span>
        <span class="tab-name">Shuro Chi</span>
        <span class="tab-type">Puzzle + DPS</span>
        <span class="tab-completed-badge" id="tab-badge-1">✓</span>
      </button>
      <button class="encounter-tab" role="tab" aria-selected="false" data-enc="2" onclick="switchEncounterTab(2)">
        <span class="tab-number">E3</span>
        <span class="tab-name">Morgeth</span>
        <span class="tab-type">Orb Puzzle</span>
        <span class="tab-completed-badge" id="tab-badge-2">✓</span>
      </button>
      <button class="encounter-tab" role="tab" aria-selected="false" data-enc="3" onclick="switchEncounterTab(3)">
        <span class="tab-number">E4</span>
        <span class="tab-name">The Vault</span>
        <span class="tab-type">Symbol Maze</span>
        <span class="tab-completed-badge" id="tab-badge-3">✓</span>
      </button>
      <button class="encounter-tab" role="tab" aria-selected="false" data-enc="4" onclick="switchEncounterTab(4)">
        <span class="tab-number">E5</span>
        <span class="tab-name">Riven</span>
        <span class="tab-type">Eye Puzzle + Boss</span>
        <span class="tab-completed-badge" id="tab-badge-4">✓</span>
      </button>
    </div>
  </div>
</section>
