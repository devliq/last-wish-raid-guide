<!-- PROGRESS MODAL -->
<div class="progress-modal" id="progress-modal">
  <div class="progress-modal-content">
    <div class="progress-modal-header">
      <h3>Last Wish Progress</h3>
      <button class="progress-modal-close" id="progress-modal-close">×</button>
    </div>
    <div class="progress-modal-body">
      <div class="overall-progress">
        <div class="progress-header">
          <span class="progress-title">Total Completion</span>
          <span class="progress-pct" id="modal-progress-pct">0%</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="modal-progress-bar" style="width: 0%"></div>
        </div>
      </div>
      <div class="progress-encounters" id="modal-encounters">
        <div class="enc-progress-dot" data-enc="0"><span class="dot"></span> Kalli</div>
        <div class="enc-progress-dot" data-enc="1"><span class="dot"></span> Shuro Chi</div>
        <div class="enc-progress-dot" data-enc="2"><span class="dot"></span> Morgeth</div>
        <div class="enc-progress-dot" data-enc="3"><span class="dot"></span> Vault</div>
        <div class="enc-progress-dot" data-enc="4"><span class="dot"></span> Riven</div>
      </div>
    </div>
  </div>
</div>
